name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.18"
          enable-cache: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: uv sync --locked --extra dev
      - run: uv run ruff format --check src tests deploy/standalone/entrypoint.py
      - run: uv run ruff check src tests deploy/standalone/entrypoint.py
      - run: uv run pyright
      - run: uv run python -m py_compile deploy/standalone/entrypoint.py
      - run: uv run pytest
      - run: uv run pip-audit

  soundcloud:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: deploy/lavalink/soundcloud-plugin/pom.xml
      - run: mvn -B -ntp -f deploy/lavalink/soundcloud-plugin/pom.xml verify

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: dizzybot:test
      - uses: docker/build-push-action@v7
        with:
          context: deploy/lavalink
          push: false
          tags: dizzybot-lavalink:test
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/standalone/Dockerfile
          push: false
          tags: dizzybot-standalone:test
