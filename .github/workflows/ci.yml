name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.7"
          enable-cache: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: uv sync --frozen --extra dev
      - run: uv run ruff format --check src tests deploy/standalone/entrypoint.py
      - run: uv run ruff check src tests deploy/standalone/entrypoint.py
      - run: uv run pyright
      - run: uv run python -m py_compile deploy/standalone/entrypoint.py
      - run: uv run pytest
      - run: uv run pip-audit

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: dizzybot:test
      - uses: docker/build-push-action@v6
        with:
          context: deploy/lavalink
          push: false
          tags: dizzybot-lavalink:test
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/standalone/Dockerfile
          push: false
          tags: dizzybot-standalone:test
