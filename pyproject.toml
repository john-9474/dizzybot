[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "dizzybot"
version = "0.1.0"
description = "An extensible, self-hosted Discord music bot"
readme = "README.md"
requires-python = ">=3.13,<3.15"
license = "GPL-3.0-only"
authors = [{ name = "DizzyBot contributors" }]
dependencies = [
  "aiohttp==3.14.3",
  "aiosqlite==0.22.1",
  "alembic==1.19.1",
  "davey==0.1.6",
  "discord.py==2.7.1",
  "PyNaCl==1.6.2",
  "pydantic==2.13.5",
  "PyYAML==6.0.3",
  "SQLAlchemy==2.0.52",
  "wavelink==3.5.2",
]

[project.optional-dependencies]
dev = [
  "pip-audit==2.10.1",
  "pyright==1.1.411",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "pytest-cov==7.1.0",
  "ruff==0.16.5",
]

[project.scripts]
dizzybot = "dizzybot.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dizzybot"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config --cov=dizzybot --cov-report=term-missing --cov-fail-under=85"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["dizzybot"]
omit = ["src/dizzybot/__main__.py"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "RUF"]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
include = ["src"]
exclude = ["tests", ".venv"]
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
