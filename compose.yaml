name: dizzybot

services:
  lavalink:
    image: ghcr.io/john-9474/dizzybot-lavalink:${DIZZYBOT_VERSION:-latest}
    build:
      context: deploy/lavalink
    restart: unless-stopped
    environment:
      LAVALINK_PASSWORD: ${LAVALINK_PASSWORD:?Set LAVALINK_PASSWORD in .env}
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID:-}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET:-}
      SPOTIFY_COUNTRY_CODE: ${SPOTIFY_COUNTRY_CODE:-GB}
      APPLE_MUSIC_COUNTRY_CODE: ${APPLE_MUSIC_COUNTRY_CODE:-GB}
      TIDAL_TOKEN: ${TIDAL_TOKEN:-}
      TIDAL_COUNTRY_CODE: ${TIDAL_COUNTRY_CODE:-GB}
      _JAVA_OPTIONS: ${LAVALINK_JAVA_OPTIONS:--Xms128m -Xmx1g}
    networks:
      - audio

  bot:
    image: ghcr.io/john-9474/dizzybot:${DIZZYBOT_VERSION:-latest}
    build:
      context: .
    restart: unless-stopped
    depends_on:
      lavalink:
        condition: service_healthy
    environment:
      DISCORD_TOKEN: ${DISCORD_TOKEN:?Set DISCORD_TOKEN in .env}
      LAVALINK_PASSWORD: ${LAVALINK_PASSWORD:?Set LAVALINK_PASSWORD in .env}
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID:-}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET:-}
      TIDAL_TOKEN: ${TIDAL_TOKEN:-}
      DIZZYBOT__LOGGING__LEVEL: ${LOG_LEVEL:-INFO}
      DIZZYBOT__BOT__DEFAULT_VOLUME: ${DEFAULT_VOLUME:-75}
      DIZZYBOT__BOT__IDLE_TIMEOUT_SECONDS: ${IDLE_TIMEOUT_SECONDS:-300}
      DIZZYBOT__BOT__STAY_CONNECTED: ${STAY_CONNECTED:-false}
      DIZZYBOT__BOT__DEFAULT_SEARCH_SOURCE: ${DEFAULT_SEARCH_SOURCE:-youtube}
      DIZZYBOT__BOT__PLAYLIST_TRACK_LIMIT: ${PLAYLIST_TRACK_LIMIT:-100}
      DIZZYBOT__BOT__QUEUE_TRACK_LIMIT: ${QUEUE_TRACK_LIMIT:-500}
      DIZZYBOT__BOT__RADIO_STATION_LIMIT: ${RADIO_STATION_LIMIT:-50}
      DIZZYBOT__BOT__ALLOW_PRIVATE_RADIO_STREAMS: ${ALLOW_PRIVATE_RADIO_STREAMS:-false}
      DIZZYBOT__BOT__REPOST_PLAYER_CONTROLS: ${REPOST_PLAYER_CONTROLS:-true}
      DIZZYBOT__BOT__COMMAND_SYNC_GUILD_ID: ${COMMAND_SYNC_GUILD_ID:-null}
    volumes:
      - bot_data:/data
    networks:
      - audio

volumes:
  bot_data:

networks:
  audio:
    driver: bridge
